version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/student-result-predictor

file_exists_behavior: OVERWRITE

permissions:
  - object: scripts
    pattern: "*.sh"
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/install_app.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 120
      runas: root
